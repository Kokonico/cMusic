[tool.poetry]
name = "cmusic"
version = "2.0.0"
description = "the CLI music player"
authors = ["Kokonico <kokonico@duck.com>"]
readme = "README.md"
scripts = {"cmusic" = "cmusic.cmusic:main"}

[tool.poetry.dependencies]
python = "^3.12"
objlog = "==3.0.0"
tinytag = "^2.1.1"
mutagen = "^1.47.0"
inquirer = "^3.2.4"
setuptools = "=80.8.0"
pygame-ce = "^2.5.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"